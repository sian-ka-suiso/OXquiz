            <?php
                $chapter_name = $chapter['chapter_name'];
                $text_class = (mb_strlen($chapter_name) > 5) ? 'small-text' : ''; 
            ?>
            <?php $section_names = $chapter['sections']; ?>
            <form action="section.php" method="get" class="chapter-card">
                <input type="hidden" name="chapter_id" value="<?= V2H($chapter_id); ?>">
                <button type="submit">
                    <div class="chapter-name-container <?= V2H($text_class) ?>">
                        <span><?= V2H($chapter_name); ?></span>
                    </div>
                    <!-- セクション名リスト -->
                    <div class="section-name-container">
                        <?php $section_index = 1; ?>
                        <?php foreach ($section_names as $section): ?>
                        <?php if ($section['section_published'] || $is_admin): ?>
                            <span class="font-Noto"><?= V2H($section_index) ?>. <?= V2H($section['name']); ?></span>
                        <?php endif; ?>
                        <?php $section_index++; ?>
                        <?php endforeach; ?>
                        <?php
                            $progress     = $chapter_progress[$chapter_id] ?? ['total' => 0, 'correct_count' => 0];
                            $total        = $progress['total'];
                            $correct      = $progress['correct_count'];
                            $percent      = ($total > 0) ? round($correct / $total * 100) : 0;

                            if ($total === 0 || $correct === 0) {
                                $progress_label = '未着手';
                                $progress_class = 'progress-none';
                            } elseif ($percent === 100) {
                                $progress_label = '完了！';
                                $progress_class = 'progress-done';
                            } else {
                                $progress_label = $correct . ' / ' . $total . ' 完了　' . $percent . '%';
                                $progress_class = 'progress-ongoing';
                            }
                        ?>
                        <div class="chapter-progress <?= $progress_class ?>">
                            <?= $progress_label ?>
                        </div>
                        <div class="progress-bar-wrap">
                            <div class="progress-bar-fill <?= $progress_class ?>" style="width: <?= $percent ?>%;"></div>
                        </div>
                    </div>
                </button>
            </form>
            <?php $chapter_index++; ?>
            <?php $section_index = 1; ?>
            <?php endif; ?>
